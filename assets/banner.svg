<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Practical software for campuses and small businesses</title>
  <desc id="desc">Profile banner: deep navy background with a faint dot grid, a code comment line, the tagline in white, and a blinking cyan cursor.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E293B"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0B1220" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="#0B1220"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="16" fill="url(#fade)"/>

  <!-- faint code motif on the right -->
  <text x="1150" y="200" text-anchor="end" class="mono" font-size="190" fill="#22D3EE" fill-opacity="0.07">{ }</text>

  <!-- accent rule -->
  <rect x="64" y="58" width="44" height="3" rx="1.5" fill="#22D3EE"/>

  <text x="64" y="96" class="mono" font-size="17" fill="#64748B">// full-stack developer · b.tech cse (ai &amp; ml)</text>

  <text x="64" y="156" class="sans" font-size="44" font-weight="700" fill="#F1F5F9">Practical software for</text>
  <text x="64" y="210" class="sans" font-size="44" font-weight="700" fill="#F1F5F9">campuses &amp; small businesses<tspan fill="#22D3EE">.</tspan><tspan class="cursor" fill="#22D3EE" font-weight="400">&#160;_</tspan></text>

  <text x="64" y="248" class="mono" font-size="15" fill="#94A3B8">java · javascript · typescript · react · node · spring boot · fastapi</text>
</svg>
